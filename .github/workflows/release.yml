name: Release

# Push a tag like `v0.1.0` to build per-platform artifacts and attach them to a
# GitHub Release. The release is created as a DRAFT so you can review the
# (unsigned) artifacts and edit notes before publishing.
#
# The build matrix ONLY builds and uploads artifacts; a single dependent
# `release` job then collects them and creates the release exactly once. This
# avoids the race where parallel matrix runners each create/dedupe the same
# release and can clobber it.
on:
  push:
    tags:
      - 'v*'

# Least privilege by default; only the release job gets write.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundles
        run: pnpm run build

      - name: Package (electron-builder)
        # Builds the current runner's targets (see the `build` block in
        # package.json). Unsigned — no signing secrets are configured.
        run: pnpm exec electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # One artifact bundle per OS; the release job merges them all.
          name: dist-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.snap
            dist/*.deb
          # Each OS produces only its own formats; fail only if a runner
          # produced nothing distributable at all.
          if-no-files-found: error
          retention-days: 1

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          # Flatten every OS bundle into one dist/ directory.
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
